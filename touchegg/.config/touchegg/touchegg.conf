<touchégg>
  <application name="All">
    <gesture type="SWIPE" fingers="3" direction="DOWN">
      <action type="RUN_COMMAND">
        <repeat>true</repeat>
        <command>omarchy-audio-output-volume -5</command>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="3" direction="UP">
      <action type="RUN_COMMAND">
        <repeat>true</repeat>
        <command>omarchy-audio-output-volume +5</command>
      </action>
    </gesture>


    <gesture type="SWIPE" fingers="4" direction="DOWN">
      <action type="RUN_COMMAND">
        <repeat>true</repeat>
        <command>omarchy-brightness-display 5%-</command>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="4" direction="UP">
      <action type="RUN_COMMAND">
        <repeat>true</repeat>
        <command>omarchy-brightness-display +5%</command>
      </action>
    </gesture>
  </application>
</touchégg>
